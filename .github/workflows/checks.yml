name: Offline figure check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            src
            script
            analysis
            results/splines
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.12"
          python-version: "3.11"
      - name: Install the locked Python environment
        run: uv sync --locked
      - name: Redraw spline figures without fitting models
        run: uv run --locked python analysis/splines/reproduce_figures.py
