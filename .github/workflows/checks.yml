name: Offline examples and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            examples
            tests
            src
            script
            data/annotations/main/roland_fr
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.12"
          python-version: "3.11"
      - name: Install the locked Python environment
        run: uv sync --locked
      - name: Run offline regression checks
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Run the public example
        run: uv run --locked python examples/summarize_scores.py
